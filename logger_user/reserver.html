<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante El Fogón</title>
</head>
    <body>
        <center>
        <header>
            <nav>
                <ul>
                    <li><a href="../index.html">pagina principal</a></li>
                    <li><a href="../logger_user/order_food.html">ordenar comida</a></li>
                    <li><a></a></li>
                </ul>
            </nav>   
            <h1>Restaurante El Fogón.</h1>
        </header>
        <section id="descripcion_restaurante">
        <main>
            <p>Bienvenido a nuestra pagina para hacer tu reserva.</p>
            <form> 
                <label for="username">nombre</label><br>
                <input type="text" id="username" required placeholder="nombre" name="username">
                <br>
                <label for="email">Correo</label><br>
                <input type="email" id="email_reserver" required>
                <br>
                <label for="date_reserver">Fecha reservacion</label><br>
                <input type="datetime-local" id="date_reserver" required>
                <br>
                <label for="lugar_mesa">¿en que lugar quieres la mesa?</label>
                <br>
                <select id="lugar_mesa">
                    <option>terraza</option>
                    <option>interior</option>
                </select>
                <br>
                <label for="note">Nota sobre reservacion</label><br>
                <textarea cols="50" rows="5" placeholder="¿alguna sugerencia sobre la reservacion?"></textarea>
                <br>
                <input type="submit" value="pedir">
            </form>
        <br><br>
    </main>
    </center>
    </body>
</html>
